services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Compose está pensado para desarrollo o despliegue autoalojado en red local.
    # No publiques PostgreSQL en interfaces externas sin TLS y firewall.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app_db}
      PORT: ${PORT:-3000}
      AUTO_MIGRATE_ON_BOOT: ${AUTO_MIGRATE_ON_BOOT:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ASSISTANT_AI_BASE_URL: ${ASSISTANT_AI_BASE_URL:-https://api.deepseek.com/v1}
      ASSISTANT_AI_MODEL: ${ASSISTANT_AI_MODEL:-deepseek-chat}
      ASSISTANT_AI_API_KEY: ${ASSISTANT_AI_API_KEY:-}
      ASSISTANT_INTERNAL_BASE_URL: ${ASSISTANT_INTERNAL_BASE_URL:-http://127.0.0.1:3000}
      ASSISTANT_STT_BASE_URL: ${ASSISTANT_STT_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      ASSISTANT_STT_MODEL: ${ASSISTANT_STT_MODEL:-gemini-3.5-transcribe}
      ASSISTANT_STT_API_KEY: ${ASSISTANT_STT_API_KEY:-}
      ASSISTANT_VISION_BASE_URL: ${ASSISTANT_VISION_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ASSISTANT_VISION_MODEL: ${ASSISTANT_VISION_MODEL:-gemini-3.5-flash-lite}
      ASSISTANT_VISION_API_KEY: ${ASSISTANT_VISION_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      APP_URL: ${APP_URL:-}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      WOMPI_CHECKOUT_URL: ${WOMPI_CHECKOUT_URL:-https://checkout.wompi.co/p/}
      WOMPI_REDIRECT_URL: ${WOMPI_REDIRECT_URL:-}
      SENSOR_WEBHOOK_TOKEN: ${SENSOR_WEBHOOK_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SIPSA_SOAP_URL: ${SIPSA_SOAP_URL:-http://appweb.dane.gov.co:9001/sipsaWS/SrvSipsaUpraBeanService}
      NEXT_PUBLIC_SWETRIX_PID: ${NEXT_PUBLIC_SWETRIX_PID:-}
      NEXT_PUBLIC_SWETRIX_API_URL: ${NEXT_PUBLIC_SWETRIX_API_URL:-}
      LEGAL_RAZON_SOCIAL: ${LEGAL_RAZON_SOCIAL:-}
      LEGAL_NIT: ${LEGAL_NIT:-}
      LEGAL_TIPO_PERSONA: ${LEGAL_TIPO_PERSONA:-persona natural}
      LEGAL_CIUDAD: ${LEGAL_CIUDAD:-Ibagué, Tolima, Colombia}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_WHATSAPP: ${LEGAL_WHATSAPP:-}
      LEGAL_IVA_NOTE: ${LEGAL_IVA_NOTE:-}
    ports:
      - "3000:3000"
  external-sources-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      - app
    environment:
      EXTERNAL_SOURCES_SYNC_URL: http://app:3000/api/cron/fuentes-externas
      EXTERNAL_SOURCES_SYNC_INTERVAL_MINUTES: ${EXTERNAL_SOURCES_SYNC_INTERVAL_MINUTES:-60}
      CRON_SECRET: ${CRON_SECRET:-}
    command: ["node", "scripts/external-sources-scheduler.mjs"]
  agent-proactivo-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      - app
    environment:
      AGENT_PROACTIVE_URL: http://app:3000/api/cron/agente-proactivo
      AGENT_PROACTIVE_HOUR_BOGOTA: ${AGENT_PROACTIVE_HOUR_BOGOTA:-6}
      CRON_SECRET: ${CRON_SECRET:-}
    command: ["node", "scripts/agent-proactive-scheduler.mjs"]
  migrate:
    build:
      context: .
      target: builder
    profiles: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    command: ["npm", "run", "db:bootstrap"]
volumes:
  pgdata:
