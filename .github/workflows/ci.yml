name: CI - El Gallinero

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# This workflow never deploys and never uses production secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Mirrors the harmless build-only URL used in the existing Dockerfile.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production compilation without deployment
        run: npm run build

  tests:
    name: Vitest with disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gallinero_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: gallinero_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallinero_ci -d gallinero_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # All data belongs to the temporary service container; never reuse with production.
      DATABASE_URL: postgresql://gallinero_ci:ci_only_not_a_secret@127.0.0.1:5432/gallinero_ci
      DEMO_ADMIN_PASSWORD: ci_local_test_only_12345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --fund=false
      - name: Initialize isolated schema
        run: npm run db:push -- --force
      - name: Apply idempotent migrations to isolated database
        run: npm run db:migrate
      - name: Seed disposable test database only
        run: npm run db:seed -- --allow-destructive
      - name: Run Vitest unit and integration tests
        run: npm test
